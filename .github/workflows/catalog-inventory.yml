# Counts-only public diagnostics from an encrypted backup's disposable public copy.
# This uses auth stubs and is NOT a full database recovery proof or a solver test.
name: 匯入資料盤點
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: '選填：指定未過期加密備份 ID；不接受舊明文備份'
        required: false
        type: string
permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 驗證密文選擇與統計輸出邊界
        run: |
          npm ci --prefix web --ignore-scripts
          node --test tools/backup-artifact.test.mjs tools/catalog-inventory.test.mjs

      - name: 下載有效加密備份（不回退明文）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ARTIFACT_ID: ${{ inputs.artifact_id }}
          BACKUP_ENCRYPTED_ONLY: 'true'
        run: |
          set -euo pipefail
          umask 077
          node tools/backup-artifact.mjs
          [ "$(unzip -Z1 backup.zip)" = 'database.tar.age' ] || { echo 'Invalid encrypted artifact layout'; exit 1; }
          mkdir -p "$RUNNER_TEMP/catalog-cipher"
          unzip -q backup.zip -d "$RUNNER_TEMP/catalog-cipher"

      - name: 真正解密並驗證 scope、24小時新鮮度與 checksums
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_ENCRYPTED_FILE: ${{ runner.temp }}/catalog-cipher/database.tar.age
          BACKUP_IDENTITY_FILE: ${{ runner.temp }}/catalog-identity
          BACKUP_RESTORE_DIR: ${{ runner.temp }}/catalog-private
        run: |
          set -euo pipefail
          umask 077
          sudo apt-get update -qq && sudo apt-get install -y age
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$BACKUP_IDENTITY_FILE"
          node tools/encrypted-backup.mjs unpack

      - name: 還原 public 到拋棄式 PostgreSQL 17（非完整還原證明）
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/catalog-private"
          docker network create inv-net >/dev/null 2>&1 || { echo 'Isolated network failed'; exit 1; }
          docker run -d --name inv-pg --network inv-net -e POSTGRES_PASSWORD=inv postgres:17 >/dev/null 2>&1 || { echo 'Isolated database failed'; exit 1; }
          READY=0
          for i in $(seq 1 20); do
            if docker exec inv-pg pg_isready -U postgres >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          [ "$READY" = '1' ] || { echo 'Isolated database not ready'; exit 1; }
          docker exec inv-pg psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 -c \
            "DROP SCHEMA IF EXISTS public CASCADE;
             CREATE SCHEMA auth;
             CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
             CREATE TABLE auth.users (id uuid PRIMARY KEY);
             CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;" \
            > "$private/init.out" 2> "$private/init.err" || { echo 'Isolated initialization failed; diagnostics withheld'; exit 1; }
          docker run --rm --network inv-net -v "$private:/backup:ro" -e PGPASSWORD=inv postgres:17 \
            pg_restore --no-owner --no-privileges --exit-on-error --disable-triggers --section=pre-data --section=data \
            -h inv-pg -U postgres -d postgres /backup/public.dump \
            > "$private/pre.out" 2> "$private/pre.err" || { echo 'Public copy restore failed; diagnostics withheld'; exit 1; }
          docker run --rm -v "$private:/backup:ro" postgres:17 \
            pg_restore -f /dev/stdout --section=post-data /backup/public.dump \
            > "$private/post.sql" 2> "$private/post.err" || { echo 'Constraint extraction failed; diagnostics withheld'; exit 1; }
          awk '
            /ALTER TABLE ONLY public\.[a-zA-Z_0-9]+/ { tbl = $4; sub(/public\./, "", tbl); next }
            /^ *ADD CONSTRAINT / && /FOREIGN KEY/ && /REFERENCES auth\.users/ {
              if (match($0, /FOREIGN KEY \([a-zA-Z_0-9]+\)/))
                print tbl, substr($0, RSTART + 13, RLENGTH - 14)
            }' "$private/post.sql" | sort -u > "$private/fk-pairs"
          while read -r t c; do
            [ -z "$t" ] && continue
            docker exec inv-pg psql -U postgres -d postgres -q -v ON_ERROR_STOP=1 -c \
              "INSERT INTO auth.users (id) SELECT DISTINCT $c FROM public.$t WHERE $c IS NOT NULL ON CONFLICT (id) DO NOTHING;" \
              >> "$private/stubs.out" 2>> "$private/stubs.err" || { echo 'Auth stub preparation failed; diagnostics withheld'; exit 1; }
          done < "$private/fk-pairs"
          docker run --rm --network inv-net -v "$private:/backup:ro" -e PGPASSWORD=inv postgres:17 \
            pg_restore --no-owner --no-privileges --exit-on-error --section=post-data \
            -h inv-pg -U postgres -d postgres /backup/public.dump \
            > "$private/constraints.out" 2> "$private/constraints.err" || { echo 'Public constraints restore failed; diagnostics withheld'; exit 1; }
          echo 'Disposable public copy restored; private restore output withheld'

      - name: 唯讀盤點與嚴格數值輸出
        run: |
          set -euo pipefail
          umask 077
          node tools/catalog-inventory.mjs sql > "$RUNNER_TEMP/catalog-private/query.sql"
          docker exec -i inv-pg psql -U postgres -d postgres -X -q -t -A -v ON_ERROR_STOP=1 \
            < "$RUNNER_TEMP/catalog-private/query.sql" \
            > "$RUNNER_TEMP/catalog-private/counts.json" 2> "$RUNNER_TEMP/catalog-private/query.err" \
            || { echo 'Inventory query failed; private diagnostics withheld'; exit 1; }
          node tools/catalog-inventory.mjs report "$RUNNER_TEMP/catalog-private/counts.json" > /tmp/inventory.md
          cat /tmp/inventory.md

      - name: 只上傳通過數值白名單的報告
        uses: actions/upload-artifact@v4
        with:
          name: catalog-inventory
          path: /tmp/inventory.md
          if-no-files-found: error
          retention-days: 30

      - name: 清理（失敗時也刪除本輪明文與私鑰）
        if: always()
        run: |
          docker rm -f inv-pg >/dev/null 2>&1 || true
          docker network rm inv-net >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/catalog-private" "$RUNNER_TEMP/catalog-cipher"
          rm -f -- "$RUNNER_TEMP/catalog-identity" "$GITHUB_WORKSPACE/backup.zip" /tmp/inventory.md
