# 自動部署：push 到 main 時用 Render Deploy Hook 觸發 web + solver 部署
# （Render Auto-Deploy 設定為 On Commit，但倉庫缺少 Render 的 GitHub webhook，
#   因此改由這裡代為觸發；兩個服務都會部署同一份最新 main 提交。）
# 需要 Settings → Secrets 設定 RENDER_WEB_DEPLOY_HOOK 與 RENDER_SOLVER_DEPLOY_HOOK
# 保護規則：只有變更包含 db/web/solver 且「同 SHA 的 Tests」通過才會呼叫 hook；
#           只改工作流/文件的 push 不部署（paths-ignore 防觸發，關卡輸出 skip 再擋一次）。
name: 部署 Render 正式環境

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/nightly-backup.yml'
      - '.github/workflows/backup-drill.yml'
      - '.github/workflows/permissions-drill.yml'
      - '.github/workflows/apply-migration.yml'
      - '.github/workflows/catalog-inventory.yml'
      - '.github/workflows/acceptance-sim.yml'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 測試關卡：等「Tests」（同 SHA）通過才允許部署
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set_deploy() { echo "deploy=$1" >> "$GITHUB_OUTPUT"; }
          # 手動 dispatch（無 before SHA）直接放行：人工觸發視為有意部署
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "非 push 事件（手動觸發），直接部署"; set_deploy go; exit 0
          fi
          # 用 compare API 取變更檔案（push payload 的 added/modified 欄位實測為 null，不可靠）
          CMP=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/compare/$BEFORE_SHA...$AFTER_SHA")
          CHANGED=$(printf '%s' "$CMP" | jq -r 'if .files then [.files[].filename] | unique | .[] else empty end')
          if [ -z "$CHANGED" ]; then
            echo "::error::無法取得變更檔案（compare 回應：$(printf '%s' "$CMP" | jq -r '.message // "非預期格式"')）— 保守取消部署"
            exit 1
          fi
          echo "變更檔案："; echo "$CHANGED"
          # 判定「需要部署」的檔案＝db/web/solver 變更，排除非執行期檔案（tests 驅動、maintenance 工作表）。
          # migrations 仍計入：schema 變更後重部署確保服務與新結構相容。
          # 不廣泛排除 db/，真正的資料庫變更（schema/遷移/程式）仍會觸發部署判斷。
          NEED=$(printf '%s\n' "$CHANGED" | grep -E '^(db/|web/|solver/)|^\.github/workflows/tests\.yml$' | grep -vE '^db/(tests|maintenance)/' || true)
          if [ -z "$NEED" ]; then
            echo "無需部署的程式變更（僅工作流／文件／純驗收驅動）→ 跳過部署（不呼叫 hook）"
            set_deploy skip; exit 0
          fi
          echo "需要部署的變更："; echo "$NEED"
          echo "等待 Tests（SHA=${AFTER_SHA:0:7}）完成…"
          for i in $(seq 1 60); do
            RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$AFTER_SHA&event=push&per_page=20")
            STATUS=$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.name=="Tests" and .event=="push")][0].status // "none"')
            CONCL=$(printf '%s' "$RUNS" | jq -r '[.workflow_runs[] | select(.name=="Tests" and .event=="push")][0].conclusion // "none"')
            echo "  [$i] Tests status=$STATUS conclusion=$CONCL"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCL" = "success" ]; then echo "✓ Tests 通過，允許部署"; set_deploy go; exit 0; fi
              echo "::error::Tests 結論為 $CONCL，取消部署"; exit 1
            fi
            sleep 30
          done
          echo "::error::等待 Tests 超時（30 分鐘），取消部署"; exit 1
      - name: 觸發 web 部署
        if: steps.gate.outputs.deploy == 'go'
        env:
          HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          code=$(curl -s -o /tmp/web.json -w '%{http_code}' -X POST "$HOOK")
          echo "HTTP $code $(cat /tmp/web.json)"
          case "$code" in 200|201|202) echo "web deploy triggered";; *) echo "::error::web hook failed"; exit 1;; esac
      - name: 觸發 solver 部署
        if: steps.gate.outputs.deploy == 'go'
        env:
          HOOK: ${{ secrets.RENDER_SOLVER_DEPLOY_HOOK }}
        run: |
          code=$(curl -s -o /tmp/solver.json -w '%{http_code}' -X POST "$HOOK")
          echo "HTTP $code $(cat /tmp/solver.json)"
          case "$code" in 200|201|202) echo "solver deploy triggered";; *) echo "::error::solver hook failed"; exit 1;; esac
