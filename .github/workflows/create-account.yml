# 一次性：建立老闆測試帳號（workflow_dispatch 手動觸發）。
# 密碼由臨時 secret BOSS_TEST_PW 提供（bcrypt 在資料庫端生成，密碼不進 Git、不進日誌）。
# 沒有該 secret 時本工作流一律失敗（防止空密碼帳號）；用完即刪 secret 即可使其失效。
name: 建立帳號（一次性）

on:
  workflow_dispatch:
    inputs:
      email:
        description: '帳號 Email（小寫）'
        required: true
        type: string
      name:
        description: '顯示名稱'
        required: true
        type: string

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查輸入與密碼 secret
        env:
          PW: ${{ secrets.BOSS_TEST_PW }}
        run: |
          EMAIL="${{ inputs.email }}"
          echo "$EMAIL" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$' || { echo "✗ Email 格式不正確（需小寫）"; exit 1; }
          [ -n "$PW" ] || { echo "✗ 缺少 BOSS_TEST_PW secret，中止（不建立空密碼帳號）"; exit 1; }

      - name: 建立帳號並設為老闆
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PW: ${{ secrets.BOSS_TEST_PW }}
        run: |
          cat > /tmp/create_user.sql <<'SQL'
          create extension if not exists pgcrypto;
          -- 帳號不存在才建立（冪等）
          insert into auth.users (
            id, aud, role, email, encrypted_password,
            email_confirmed_at, created_at, updated_at,
            raw_app_meta_data, raw_user_meta_data
          )
          select gen_random_uuid(), 'authenticated', 'authenticated', :'email',
                 crypt(:'pw', gen_salt('bf')), now(), now(), now(),
                 '{"provider":"email","providers":["email"]}'::jsonb,
                 jsonb_build_object('name', :'name')::jsonb
          where not exists (select 1 from auth.users where email = :'email');
          -- identity 不存在才建立（登入所需）
          insert into auth.identities (
            id, provider_id, user_id, identity_data, provider,
            last_sign_in_at, created_at, updated_at
          )
          select gen_random_uuid(), u.id::text, u.id,
                 jsonb_build_object('sub', u.id::text, 'email', u.email, 'email_verified', true),
                 'email', now(), now(), now()
          from auth.users u
          where u.email = :'email'
            and not exists (select 1 from auth.identities i where i.user_id = u.id);
          -- 顯示名稱與老闆角色
          update profiles set display_name = :'name', role = 'boss'
          where user_id = (select id from auth.users where email = :'email');
          -- 驗證輸出（不含任何敏感欄位）
          select p.display_name, p.role, (u.email_confirmed_at is not null) as confirmed
          from profiles p join auth.users u on u.id = p.user_id
          where u.email = :'email';
          SQL
          docker run --rm -e DATABASE_URL -e PW -e EMAIL="${{ inputs.email }}" -e NAME="${{ inputs.name }}" \
            -v /tmp/create_user.sql:/create_user.sql:ro postgres:17 \
            sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v email="$EMAIL" -v name="$NAME" -v pw="$PW" -f /create_user.sql' \
            || { echo "✗ 建立失敗"; exit 1; }
          echo "✓ 帳號建立／更新完成"
