# 每月一日自動下載最新備份並驗證可完整還原
name: 備份還原演練
on:
  schedule:
    - cron: "0 18 1 * *"  # 每月 1 日 18:00 UTC
  workflow_dispatch: {}

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: 下載最新備份
        run: |
          ARTIFACTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=20" | \
            jq -r '.artifacts[] | select(.name | startswith("db-backup-")) | .id' | head -1)
          if [ -z "$ARTIFACTS" ]; then echo "No backup artifact found"; exit 1; fi
          curl -s -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACTS/zip" -o backup.zip
          unzip -o backup.zip -d restored/
          echo "Backup downloaded: $(ls -lh restored/)"

      - name: 驗證備份完整性（PG17 Docker 容器跑 pg_restore --list）
        run: |
          set -o pipefail
          DUMP=$(ls restored/*.dump | head -1)
          if [ -z "$DUMP" ]; then echo "No .dump file found"; exit 1; fi
          DUMP_BASE=$(basename "$DUMP")
          echo "Verifying: $DUMP ($(stat -c%s "$DUMP") bytes)"
          # 用 PG17 Docker 跑 pg_restore --list，exit code 存檔再判斷
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore --list /backup/$DUMP_BASE" > /tmp/toc.txt 2>/tmp/toc_err.txt
          TOC_EXIT=$?
          if [ $TOC_EXIT -ne 0 ]; then
            echo "✗ pg_restore --list FAILED (exit $TOC_EXIT):"
            cat /tmp/toc_err.txt
            exit 1
          fi
          echo "✓ pg_restore --list OK"
          TABLES=$(grep -c "TABLE DATA" /tmp/toc.txt || true)
          FUNCS=$(grep -c " FUNCTION " /tmp/toc.txt || true)
          echo "Tables with data: $TABLES | Functions: $FUNCS"
          if [ "$TABLES" -lt 30 ]; then
            echo "✗ Expected ≥30 tables, got $TABLES"
            exit 1
          fi

      - name: 還原到隔離 PostgreSQL 17（exit code 不經 pipe）
        run: |
          set -o pipefail
          DUMP=$(ls restored/*.dump | head -1)
          DUMP_BASE=$(basename "$DUMP")
          docker network create drill-net 2>/dev/null || true
          docker run -d --name drill-pg --network drill-net \
            -e POSTGRES_PASSWORD=drill postgres:17
          sleep 5
          for i in $(seq 1 15); do
            docker exec drill-pg pg_isready -U postgres && break
            sleep 2
          done
          # 還原：stdout/stderr 各存檔，exit code 不被遮蔽
          docker run --rm --network drill-net \
            -v "$PWD/restored:/backup" \
            -e PGPASSWORD=drill \
            postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges --exit-on-error -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" \
            > /tmp/restore_out.txt 2> /tmp/restore_err.txt
          RESTORE_EXIT=$?
          echo "Restore exit code: $RESTORE_EXIT"
          if [ $RESTORE_EXIT -ne 0 ]; then
            echo "✗ Restore FAILED (exit $RESTORE_EXIT). Errors (last 20 lines):"
            tail -20 /tmp/restore_err.txt
            echo "Full error count: $(wc -l < /tmp/restore_err.txt)"
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null
            exit 1
          fi
          echo "✓ Restore completed (exit 0)"

      - name: 深度驗證（表清單、筆數、函式、RLS）
        run: |
          set -o pipefail
          # 預期表數量
          TABLES=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "Restored tables: $TABLES"
          if [ "$TABLES" -lt 35 ]; then
            echo "✗ Expected ≥35 tables, got $TABLES"
            docker rm -f drill-pg; exit 1
          fi
          # 關鍵函式
          FUNCS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('schedule_snapshot','apply_plan','save_blocks','save_rush_orders','save_work_log','save_transfer_orders','resolve_leave_request','create_leave_request')")
          echo "Critical functions: $FUNCS / 8"
          if [ "$FUNCS" -lt 8 ]; then
            echo "✗ Missing critical functions"
            docker rm -f drill-pg; exit 1
          fi
          # RLS 政策
          RLS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_policies WHERE schemaname='public'")
          echo "RLS policies: $RLS"
          # 關鍵資料
          EMP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM employees" 2>/dev/null || echo "ERR")
          MACH=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM machines" 2>/dev/null || echo "ERR")
          SP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT setup_pending FROM schedule_state LIMIT 1" 2>/dev/null || echo "ERR")
          echo "employees: $EMP | machines: $MACH | setup_pending: $SP"
          if [ "$EMP" = "ERR" ] || [ "$EMP" -lt 10 ]; then
            echo "✗ employees table missing or empty"
            docker rm -f drill-pg; exit 1
          fi
          echo ""
          echo "✓✓✓ Backup restore drill FULLY PASSED ✓✓✓"
          docker rm -f drill-pg
          docker network rm drill-net 2>/dev/null || true
