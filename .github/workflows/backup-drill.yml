# 每月一日自動下載最新備份並驗證可完整還原
# 注意：GitHub Actions step 預設 bash -e，任何指令非零即中止；
#       所有「允許失敗再判斷」的指令必須用 || VAR=$? 模式捕捉，不能裸跑。
name: 備份還原演練
on:
  schedule:
    - cron: "0 18 1 * *"  # 每月 1 日 18:00 UTC
  workflow_dispatch:
    inputs:
      create:
        description: '建立及加解密完整 DB 備份（不冒稱完整 DB 還原）'
        type: boolean
        default: false
      full:
        description: '在隔離 Supabase Postgres 真正還原完整 DB（不使用 Auth stub）'
        type: boolean
        default: false
      artifact_id:
        description: '完整加密备份的 artifact ID（full=true 時必填）'
        type: string
        required: false

jobs:
  encrypted-backup:
    if: github.event_name == 'workflow_dispatch' && inputs.create
    uses: ./.github/workflows/nightly-backup.yml
    secrets: inherit
  full-restore:
    if: github.event_name == 'workflow_dispatch' && inputs.full && !inputs.create
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 下載指定加密備份並驗證真正解密
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ARTIFACT_ID: ${{ inputs.artifact_id }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_ENCRYPTED_FILE: ${{ runner.temp }}/encrypted/database.tar.age
          BACKUP_IDENTITY_FILE: ${{ runner.temp }}/backup-identity
          BACKUP_RESTORE_DIR: ${{ runner.temp }}/full-recovery
        run: |
          set -euo pipefail
          umask 077
          test -n "$BACKUP_ARTIFACT_ID" && test -n "$BACKUP_AGE_IDENTITY"
          sudo apt-get update -qq && sudo apt-get install -y age
          node tools/backup-artifact.mjs
          unzip -q backup.zip -d "$RUNNER_TEMP/encrypted"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$BACKUP_IDENTITY_FILE"
          node tools/encrypted-backup.mjs unpack
          node tools/restore-roles.mjs "$BACKUP_RESTORE_DIR/roles.sql" "$BACKUP_RESTORE_DIR/roles-restore.sql"
          node -e 'const i=JSON.parse(require("fs").readFileSync(process.env.BACKUP_RESTORE_DIR+"/inventory.json")); if(i.storageObjects!==0) {console.error("External Storage objects require encrypted object backup before release");process.exit(1)}'
      - name: 真正還原完整 Auth、資料及 ACL（無 stub、任何錯誤即拒絕）
        run: |
          set -euo pipefail
          # Version pinned to the official self-hosted docker-compose image.
          docker run -d --name full-recovery-pg -e POSTGRES_PASSWORD=recovery-local-only -v "$RUNNER_TEMP/full-recovery:/backup:ro" -v "$PWD/tools:/tools:ro" supabase/postgres:17.6.1.136 > /dev/null
          READY=0
          for i in $(seq 1 60); do
            if docker exec full-recovery-pg pg_isready -U supabase_admin >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = 1 || { echo 'Isolated PostgreSQL not ready'; exit 1; }
          docker exec full-recovery-pg psql -U supabase_admin -d postgres -X --single-transaction -v ON_ERROR_STOP=1 -f /backup/roles-restore.sql > "$RUNNER_TEMP/roles-recovery.log" 2>&1 || { echo 'Roles restore failed; sensitive diagnostics withheld'; exit 1; }
          docker exec full-recovery-pg pg_restore -U supabase_admin -d postgres --single-transaction --clean --if-exists --no-owner --exit-on-error /backup/full.dump > "$RUNNER_TEMP/full-recovery.log" 2>&1 || { echo 'Full database restore failed; sensitive diagnostics withheld'; exit 1; }
          docker exec full-recovery-pg psql -U supabase_admin -d postgres -X -v ON_ERROR_STOP=1 -t -A -f /tools/recovery-proof.sql > "$RUNNER_TEMP/full-recovery-proof.json"
          node -e 'const p=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/full-recovery-proof.json"));if(p.auth_users<1||p.employees<10||p.machines<1||p.profiles_without_auth!==0||p.public_rls<1)process.exit(1);console.log("Full database restore checks passed (no personal data logged)")'
      - name: 清除解密及完整還原暫存（不發布明文）
        if: always()
        run: |
          docker rm -f full-recovery-pg >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/full-recovery" "$RUNNER_TEMP/encrypted"
          rm -f -- "$RUNNER_TEMP/backup-identity" "$RUNNER_TEMP/roles-recovery.log" "$RUNNER_TEMP/full-recovery.log" "$RUNNER_TEMP/full-recovery-proof.json"
  drill:
    if: github.event_name != 'workflow_dispatch' || (!inputs.create && !inputs.full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 下載最新備份
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/backup-artifact.mjs
          unzip -o backup.zip -d restored/
          echo "Backup downloaded; private payload is not printed"

      - name: 解密新格式（本演練仍僅驗 public 副本，不證明完整 Auth 還原）
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_ENCRYPTED_FILE: restored/database.tar.age
          BACKUP_IDENTITY_FILE: ${{ runner.temp }}/backup-identity
          BACKUP_RESTORE_DIR: ${{ runner.temp }}/db-drill-decrypted
        run: |
          if [ -f "$BACKUP_ENCRYPTED_FILE" ]; then
            umask 077
            sudo apt-get update -qq && sudo apt-get install -y age
            printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$BACKUP_IDENTITY_FILE"
            node tools/encrypted-backup.mjs unpack
            cp "$BACKUP_RESTORE_DIR/public.dump" restored/public.dump
          fi

      - name: 驗證備份完整性（PG17 Docker 容器跑 pg_restore --list）
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          if [ -z "$DUMP" ]; then echo "No .dump file found"; exit 1; fi
          DUMP_BASE=$(basename "$DUMP")
          echo "Verifying: $DUMP ($(stat -c%s "$DUMP") bytes)"
          TOC_EXIT=0
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore --list /backup/$DUMP_BASE" > /tmp/toc.txt 2> /tmp/toc_err.txt || TOC_EXIT=$?
          if [ "$TOC_EXIT" -ne 0 ]; then
            echo "✗ pg_restore --list FAILED (exit $TOC_EXIT):"
            cat /tmp/toc_err.txt
            exit 1
          fi
          echo "✓ pg_restore --list OK"
          TABLES=$(grep -c "TABLE DATA" /tmp/toc.txt || true)
          FUNCS=$(grep -c " FUNCTION " /tmp/toc.txt || true)
          echo "Tables with data: $TABLES | Functions: $FUNCS"
          if [ "${TABLES:-0}" -lt 30 ]; then
            echo "✗ Expected ≥30 tables with data, got ${TABLES:-0}"
            exit 1
          fi

      - name: 還原到隔離 PostgreSQL 17（exit code 不經 pipe、不被 -e 中止）
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          DUMP_BASE=$(basename "$DUMP")
          docker network create drill-net 2>/dev/null || true
          docker run -d --name drill-pg --network drill-net \
            -e POSTGRES_PASSWORD=drill postgres:17
          READY=0
          for i in $(seq 1 20); do
            if docker exec drill-pg pg_isready -U postgres >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "✗ PostgreSQL container never became ready"
            docker logs drill-pg | tail -20 || true
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          # 乾淨起點：只 DROP，不預先 CREATE（dump 內含 CREATE SCHEMA public，預建會撞 already exists）
          docker exec drill-pg psql -U postgres -d postgres -c \
            "DROP SCHEMA IF EXISTS public CASCADE;"
          # Supabase 專屬依賴 stub：public 的表/RLS 引用 auth.uid()、FK 參照 auth.users(id)、
          # 政策 TO authenticated/anon。vanilla postgres 沒有這些，建 stub 讓結構完整還原（僅存在於演練目標）
          docker exec drill-pg psql -U postgres -d postgres -c \
            "CREATE SCHEMA IF NOT EXISTS auth; \
             CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$; \
             CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY); \
             DO \$\$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$; \
             DO \$\$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$; \
             DO \$\$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;"
          # 還原分兩階段（exit code 用 || 捕捉，bash -e 安全）：
          # 階段 1 pre-data+data：--disable-triggers 以 replica 模式載入資料
          # 階段 2 補 auth.users stub：FK 指向 Supabase 管理的 auth.users（不在備份範圍），
          #         從還原後的資料取出所有引用的 user id 填入 stub，讓 post-data 的
          #         ADD CONSTRAINT 驗證能通過（這些值在正式庫都是有效的 auth user）
          # 階段 3 post-data：真正執行 FK/索引/觸發器驗證
          P1_EXIT=0
          docker run --rm --network drill-net \
            -v "$PWD/restored:/backup" \
            -e PGPASSWORD=drill \
            postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges --exit-on-error --disable-triggers --section=pre-data --section=data -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" \
            > /tmp/restore_out.txt 2> /tmp/restore_err.txt || P1_EXIT=$?
          echo "Phase 1 (structure+data) exit code: $P1_EXIT"
          if [ "$P1_EXIT" -ne 0 ]; then
            echo "✗ Phase 1 FAILED. stderr (last 30 lines):"
            tail -30 /tmp/restore_err.txt
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          # 從 dump 的 post-data 區段動態解析所有 REFERENCES auth.users 的 (表,欄位) 配對
          # （profiles 等表只存在於正式庫、不在 migrations 裡，硬編清單會漏）
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore -f /dev/stdout --section=post-data /backup/$DUMP_BASE" > /tmp/post-data.sql 2>/dev/null
          echo "post-data.sql lines: $(wc -l < /tmp/post-data.sql)"
          # FK 語句為兩行式（ALTER TABLE ONLY public.<t> 換行 ADD CONSTRAINT ... FOREIGN KEY (<c>) REFERENCES auth.users）
          FK_PAIRS=$(awk '
            /ALTER TABLE ONLY public\.[a-zA-Z_0-9]+/ { tbl = $4; sub(/public\./, "", tbl); next }
            /^ *ADD CONSTRAINT / && /FOREIGN KEY/ && /REFERENCES auth\.users/ {
              if (match($0, /FOREIGN KEY \([a-zA-Z_0-9]+\)/))
                print tbl, substr($0, RSTART + 13, RLENGTH - 14)
            }' /tmp/post-data.sql | sort -u)
          echo "FK pairs referencing auth.users:"; echo "$FK_PAIRS"
          if [ -z "$FK_PAIRS" ]; then
            echo "✗ No FK pairs extracted — post-data parsing broken"
            grep -c "ADD CONSTRAINT" /tmp/post-data.sql || true
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          echo "$FK_PAIRS" | while read -r t c; do
            [ -z "$t" ] && continue
            docker exec drill-pg psql -U postgres -d postgres -c \
              "INSERT INTO auth.users (id) SELECT DISTINCT $c FROM $t WHERE $c IS NOT NULL ON CONFLICT (id) DO NOTHING;" \
              || echo "  (skipped $t — not in this backup)"
          done
          echo "auth.users stub rows: $(docker exec drill-pg psql -U postgres -d postgres -t -A -c 'SELECT count(*) FROM auth.users')"
          P2_EXIT=0
          docker run --rm --network drill-net \
            -v "$PWD/restored:/backup" \
            -e PGPASSWORD=drill \
            postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges --exit-on-error --section=post-data -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" \
            > /tmp/restore_out2.txt 2> /tmp/restore_err2.txt || P2_EXIT=$?
          echo "Phase 3 (post-data constraints) exit code: $P2_EXIT"
          if [ "$P2_EXIT" -ne 0 ]; then
            echo "✗ Phase 3 FAILED. stderr (last 30 lines):"
            tail -30 /tmp/restore_err2.txt
            echo "stderr total lines: $(wc -l < /tmp/restore_err2.txt)"
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          echo "✓ Restore completed (exit 0)"

      - name: 深度驗證（表清單、筆數、函式、RLS）
        run: |
          # 預期表數量
          TABLES=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "Restored tables: $TABLES"
          if [ "$TABLES" -lt 35 ]; then
            echo "✗ Expected ≥35 tables, got $TABLES"
            docker rm -f drill-pg; exit 1
          fi
          # 關鍵函式（名稱以 db/migrations 實際定義為準）
          FUNCS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('schedule_snapshot','apply_plan','save_blocks','save_work_assignments','resolve_leave_request','set_account_permissions','list_access_accounts','update_own_profile')")
          echo "Critical functions: $FUNCS / 8"
          if [ "$FUNCS" -lt 8 ]; then
            echo "✗ Missing critical functions"
            docker rm -f drill-pg; exit 1
          fi
          # RLS 政策
          RLS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_policies WHERE schemaname='public'")
          echo "RLS policies: $RLS"
          # 關鍵資料
          EMP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM employees" 2>/dev/null || echo "ERR")
          MACH=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM machines" 2>/dev/null || echo "ERR")
          SP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT setup_pending FROM schedule_state LIMIT 1" 2>/dev/null || echo "ERR")
          echo "employees: $EMP | machines: $MACH | setup_pending: $SP"
          if [ "$EMP" = "ERR" ] || [ "$EMP" -lt 10 ]; then
            echo "✗ employees table missing or empty"
            docker rm -f drill-pg; exit 1
          fi
          echo ""
          echo "✓ Public-schema application restore passed; NOT full Auth/project recovery proof"
          docker rm -f drill-pg
          docker network rm drill-net 2>/dev/null || true

      - name: 清除解密暫存
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/db-drill-decrypted" "$GITHUB_WORKSPACE/restored"
          rm -f -- "$RUNNER_TEMP/backup-identity"
