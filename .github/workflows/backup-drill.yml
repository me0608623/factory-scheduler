# 每月一日自動下載最新備份並驗證可完整還原
# 注意：GitHub Actions step 預設 bash -e，任何指令非零即中止；
#       所有「允許失敗再判斷」的指令必須用 || VAR=$? 模式捕捉，不能裸跑。
name: 備份還原演練
on:
  schedule:
    - cron: "0 18 1 * *"  # 每月 1 日 18:00 UTC
  workflow_dispatch: {}

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: 下載最新備份
        run: |
          ARTIFACTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=20" | \
            jq -r '.artifacts[] | select(.name | startswith("db-backup-")) | .id' | head -1)
          if [ -z "$ARTIFACTS" ]; then echo "No backup artifact found"; exit 1; fi
          curl -s -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACTS/zip" -o backup.zip
          unzip -o backup.zip -d restored/
          echo "Backup downloaded: $(ls -lh restored/)"

      - name: 驗證備份完整性（PG17 Docker 容器跑 pg_restore --list）
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          if [ -z "$DUMP" ]; then echo "No .dump file found"; exit 1; fi
          DUMP_BASE=$(basename "$DUMP")
          echo "Verifying: $DUMP ($(stat -c%s "$DUMP") bytes)"
          TOC_EXIT=0
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore --list /backup/$DUMP_BASE" > /tmp/toc.txt 2> /tmp/toc_err.txt || TOC_EXIT=$?
          if [ "$TOC_EXIT" -ne 0 ]; then
            echo "✗ pg_restore --list FAILED (exit $TOC_EXIT):"
            cat /tmp/toc_err.txt
            exit 1
          fi
          echo "✓ pg_restore --list OK"
          TABLES=$(grep -c "TABLE DATA" /tmp/toc.txt || true)
          FUNCS=$(grep -c " FUNCTION " /tmp/toc.txt || true)
          echo "Tables with data: $TABLES | Functions: $FUNCS"
          if [ "${TABLES:-0}" -lt 30 ]; then
            echo "✗ Expected ≥30 tables with data, got ${TABLES:-0}"
            exit 1
          fi

      - name: 還原到隔離 PostgreSQL 17（exit code 不經 pipe、不被 -e 中止）
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          DUMP_BASE=$(basename "$DUMP")
          docker network create drill-net 2>/dev/null || true
          docker run -d --name drill-pg --network drill-net \
            -e POSTGRES_PASSWORD=drill postgres:17
          READY=0
          for i in $(seq 1 20); do
            if docker exec drill-pg pg_isready -U postgres >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "✗ PostgreSQL container never became ready"
            docker logs drill-pg | tail -20 || true
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          # 乾淨起點：只 DROP，不預先 CREATE（dump 內含 CREATE SCHEMA public，預建會撞 already exists）
          docker exec drill-pg psql -U postgres -d postgres -c \
            "DROP SCHEMA IF EXISTS public CASCADE;"
          # Supabase 專屬依賴 stub：public 的表/RLS 引用 auth.uid()，
          # 且多張表有 FK 參照 auth.users(id)（account_permissions、scenarios、feedback、line_notify）。
          # vanilla postgres 沒有 auth schema，建 stub 讓結構完整還原（僅存在於演練目標）
          docker exec drill-pg psql -U postgres -d postgres -c \
            "CREATE SCHEMA IF NOT EXISTS auth; \
             CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$; \
             CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);"
          # 還原分兩階段（exit code 用 || 捕捉，bash -e 安全）：
          # 階段 1 pre-data+data：--disable-triggers 以 replica 模式載入資料
          # 階段 2 補 auth.users stub：FK 指向 Supabase 管理的 auth.users（不在備份範圍），
          #         從還原後的資料取出所有引用的 user id 填入 stub，讓 post-data 的
          #         ADD CONSTRAINT 驗證能通過（這些值在正式庫都是有效的 auth user）
          # 階段 3 post-data：真正執行 FK/索引/觸發器驗證
          P1_EXIT=0
          docker run --rm --network drill-net \
            -v "$PWD/restored:/backup" \
            -e PGPASSWORD=drill \
            postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges --exit-on-error --disable-triggers --section=pre-data --section=data -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" \
            > /tmp/restore_out.txt 2> /tmp/restore_err.txt || P1_EXIT=$?
          echo "Phase 1 (structure+data) exit code: $P1_EXIT"
          if [ "$P1_EXIT" -ne 0 ]; then
            echo "✗ Phase 1 FAILED. stderr (last 30 lines):"
            tail -30 /tmp/restore_err.txt
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          # 從 dump 的 post-data 區段動態解析所有 REFERENCES auth.users 的 (表,欄位) 配對
          # （profiles 等表只存在於正式庫、不在 migrations 裡，硬編清單會漏）
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore -f /dev/stdout --section=post-data /backup/$DUMP_BASE" > /tmp/post-data.sql 2>/dev/null
          echo "post-data.sql lines: $(wc -l < /tmp/post-data.sql)"
          # FK 語句為兩行式（ALTER TABLE ONLY public.<t> 換行 ADD CONSTRAINT ... FOREIGN KEY (<c>) REFERENCES auth.users）
          FK_PAIRS=$(awk '
            /ALTER TABLE ONLY public\.[a-zA-Z_0-9]+/ { tbl = $4; sub(/public\./, "", tbl); next }
            /^ *ADD CONSTRAINT / && /FOREIGN KEY/ && /REFERENCES auth\.users/ {
              idx = index($0, "FOREIGN KEY (")
              if (idx > 0) {
                rest = substr($0, idx + 12)
                print tbl, substr(rest, 1, index(rest, ")") - 1)
              }
            }' /tmp/post-data.sql | sort -u)
          echo "FK pairs referencing auth.users:"; echo "$FK_PAIRS"
          if [ -z "$FK_PAIRS" ]; then
            echo "✗ No FK pairs extracted — post-data parsing broken"
            grep -c "ADD CONSTRAINT" /tmp/post-data.sql || true
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          for pair in $FK_PAIRS; do
            set -- $pair
            docker exec drill-pg psql -U postgres -d postgres -c \
              "INSERT INTO auth.users (id) SELECT DISTINCT $2 FROM $1 WHERE $2 IS NOT NULL ON CONFLICT (id) DO NOTHING;" \
              || echo "  (skipped $1 — not in this backup)"
          done
          echo "auth.users stub rows: $(docker exec drill-pg psql -U postgres -d postgres -t -A -c 'SELECT count(*) FROM auth.users')"
          P2_EXIT=0
          docker run --rm --network drill-net \
            -v "$PWD/restored:/backup" \
            -e PGPASSWORD=drill \
            postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges --exit-on-error --section=post-data -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" \
            > /tmp/restore_out2.txt 2> /tmp/restore_err2.txt || P2_EXIT=$?
          echo "Phase 3 (post-data constraints) exit code: $P2_EXIT"
          if [ "$P2_EXIT" -ne 0 ]; then
            echo "✗ Phase 3 FAILED. stderr (last 30 lines):"
            tail -30 /tmp/restore_err2.txt
            echo "stderr total lines: $(wc -l < /tmp/restore_err2.txt)"
            docker rm -f drill-pg; docker network rm drill-net 2>/dev/null || true
            exit 1
          fi
          echo "✓ Restore completed (exit 0)"

      - name: 深度驗證（表清單、筆數、函式、RLS）
        run: |
          # 預期表數量
          TABLES=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "Restored tables: $TABLES"
          if [ "$TABLES" -lt 35 ]; then
            echo "✗ Expected ≥35 tables, got $TABLES"
            docker rm -f drill-pg; exit 1
          fi
          # 關鍵函式
          FUNCS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname IN ('schedule_snapshot','apply_plan','save_blocks','save_rush_orders','save_work_log','save_transfer_orders','resolve_leave_request','create_leave_request')")
          echo "Critical functions: $FUNCS / 8"
          if [ "$FUNCS" -lt 8 ]; then
            echo "✗ Missing critical functions"
            docker rm -f drill-pg; exit 1
          fi
          # RLS 政策
          RLS=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c \
            "SELECT count(*) FROM pg_policies WHERE schemaname='public'")
          echo "RLS policies: $RLS"
          # 關鍵資料
          EMP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM employees" 2>/dev/null || echo "ERR")
          MACH=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT count(*) FROM machines" 2>/dev/null || echo "ERR")
          SP=$(docker exec drill-pg psql -U postgres -d postgres -t -A -c "SELECT setup_pending FROM schedule_state LIMIT 1" 2>/dev/null || echo "ERR")
          echo "employees: $EMP | machines: $MACH | setup_pending: $SP"
          if [ "$EMP" = "ERR" ] || [ "$EMP" -lt 10 ]; then
            echo "✗ employees table missing or empty"
            docker rm -f drill-pg; exit 1
          fi
          echo ""
          echo "✓✓✓ Backup restore drill FULLY PASSED ✓✓✓"
          docker rm -f drill-pg
          docker network rm drill-net 2>/dev/null || true
