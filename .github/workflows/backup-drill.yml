# 每月一日自動下載最新備份並驗證可還原
name: 備份還原演練
on:
  schedule:
    - cron: "0 3 1 * *"  # 每月 1 日 03:00 UTC = 台灣 11:00
  workflow_dispatch: {}

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: 下載最新備份
        run: |
          ARTIFACTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=20" | \
            jq -r '.artifacts[] | select(.name | startswith("db-backup-")) | .id' | head -1)
          if [ -z "$ARTIFACTS" ]; then echo "No backup artifact found"; exit 1; fi
          curl -s -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACTS/zip" -o backup.zip
          unzip -o backup.zip -d restored/
          echo "Backup downloaded: $(ls -lh restored/)"

      - name: 驗證備份完整性（用 postgres:17 容器跑 pg_restore）
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          if [ -z "$DUMP" ]; then echo "No .dump file found"; exit 1; fi
          DUMP_BASE=$(basename "$DUMP")
          echo "Verifying: $DUMP ($(stat -c%s "$DUMP") bytes)"
          # 備份由 PG17 pg_dump 產生（format 1.16），必須用 PG17 的 pg_restore
          docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore --list /backup/$DUMP_BASE > /dev/null && echo '✓ pg_restore --list OK' || { echo '✗ pg_restore failed'; exit 1; }"
          TABLES=$(docker run --rm -v "$PWD/restored:/backup" postgres:17 \
            sh -c "pg_restore --list /backup/$DUMP_BASE | grep -c 'TABLE DATA'" || true)
          echo "Tables in backup: $TABLES"
          if [ "$TABLES" -lt 10 ]; then echo "⚠ Backup has fewer than 10 tables — may be incomplete"; fi

      - name: 還原到暫存 PostgreSQL 17 容器
        run: |
          DUMP=$(ls restored/*.dump | head -1)
          DUMP_BASE=$(basename "$DUMP")
          # 啟動暫存 PG17、還原、驗證
          docker network create drill-net || true
          docker run -d --name drill-pg --network drill-net \
            -e POSTGRES_PASSWORD=drill -p 15432:5432 postgres:17
          sleep 5
          # 等待就緒
          for i in $(seq 1 15); do
            docker exec drill-pg pg_isready -U postgres && break
            sleep 2
          done
          # 還原（PGPASSWORD 環境變數傳入容器）
          docker run --rm --network drill-net -v "$PWD/restored:/backup" -e PGPASSWORD=drill postgres:17 \
            sh -c "pg_restore --no-owner --no-privileges -h drill-pg -U postgres -d postgres /backup/$DUMP_BASE" 2>&1 | tail -5
          # 驗證
          COUNT=$(docker exec drill-pg psql -U postgres -d postgres -t -c \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" 2>/dev/null | tr -d ' ')
          echo "Restored tables in public schema: $COUNT"
          if [ "$COUNT" -lt 10 ]; then echo "✗ Restore incomplete"; docker rm -f drill-pg; exit 1; fi
          # 抽查關鍵表有資料
          EMP=$(docker exec drill-pg psql -U postgres -d postgres -t -c "SELECT count(*) FROM employees" 2>/dev/null | tr -d ' ')
          echo "employees rows: $EMP"
          echo "✓ Backup restore drill PASSED"
          docker rm -f drill-pg
          docker network rm drill-net || true
