# 一次性：診斷並修復測試帳號登入（instance_id 補值 + bcrypt 雜湊驗證）。
name: 修復帳號登入（一次性）

on:
  workflow_dispatch:
    inputs:
      email:
        description: '帳號 Email（小寫）'
        required: true
        type: string

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 登入痕跡與既有使用者比對（找出 500 根因）
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cat > /tmp/sim.sql <<'SQL'
          \echo === A) 全部使用者數 ===
          select count(*) as total_users from auth.users;
          \echo === B) 我們帳號的登入痕跡（last_sign_in_at 有無被 GoTrue 更新） ===
          select coalesce(last_sign_in_at::text, 'NULL') as last_sign_in_at,
                 (select count(*) from auth.sessions s where s.user_id = u.id) as sessions,
                 (select count(*) from auth.refresh_tokens r where r.user_id = u.id) as refresh_tokens
          from auth.users u where email = :'email';
          \echo === C) NULL 欄位比對（我們 vs 其他第一位使用者） ===
          with ours as (select to_jsonb(u) j from auth.users u where email = :'email'),
               other as (select to_jsonb(u) j from auth.users u where email <> :'email' order by created_at limit 1)
          select coalesce(
            (select string_agg(key || ': our=' || (ours.j->>key is null) || ' other=' || (other.j->>key is null), ', ')
             from ours, other, jsonb_object_keys(ours.j) key
             where (ours.j->>key is null) is distinct from (other.j->>key is null)),
            'no-other-user-or-no-diff');
          \echo === D) identity 形狀比對（email 值遮罩） ===
          select 'OURS:   provider=' || i.provider || ' provider_id_len=' || length(i.provider_id) || ' data=' || (i.identity_data - 'email')::text
          from auth.identities i join auth.users u on u.id = i.user_id where u.email = :'email'
          union all
          select 'OTHER:  provider=' || i.provider || ' provider_id_len=' || length(i.provider_id) || ' data=' || (i.identity_data - 'email')::text
          from auth.identities i join auth.users u on u.id = i.user_id where u.email <> :'email' order by 1 limit 2;
          SQL
          docker run --rm -e DATABASE_URL -e EMAIL="${{ inputs.email }}" \
            -v /tmp/sim.sql:/sim.sql:ro postgres:17 \
            sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=0 -v email="$EMAIL" -f /sim.sql'
      - name: 傾印 auth 結構描述（診斷用）
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'psql "$DATABASE_URL" -c "\d auth.refresh_tokens" -c "\d auth.sessions"'
      - name: 診斷與修復
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PW: ${{ secrets.BOSS_TEST_PW }}
        run: |
          [ -n "$PW" ] || { echo "✗ 缺少 BOSS_TEST_PW secret（雜湊驗證需要）"; exit 1; }
          cat > /tmp/fix_user.sql <<'SQL'
          -- 1) 診斷：目前欄位狀態
          select email,
                 coalesce(instance_id::text, 'NULL') as instance_id,
                 coalesce(is_sso_user::text, 'NULL') as is_sso_user,
                 coalesce(banned_until::text, 'NULL') as banned_until,
                 aud, role,
                 (email_confirmed_at is not null) as confirmed
          from auth.users where email = :'email';
          -- 2) 修復：instance_id 補 GoTrue 標準值、明確非 SSO
          update auth.users
          set instance_id = coalesce(instance_id, '00000000-0000-0000-0000-000000000000'::uuid),
              is_sso_user = coalesce(is_sso_user, false)
          where email = :'email';
          -- 3) 驗證：資料庫端 bcrypt 比對（輸出只有 true/false）
          select (encrypted_password = crypt(:'pw', encrypted_password)) as pw_match
          from auth.users where email = :'email';
          -- 4) 修復後狀態
          select email,
                 coalesce(instance_id::text, 'NULL') as instance_id,
                 is_sso_user::text as is_sso_user
          from auth.users where email = :'email';
          SQL
          docker run --rm -e DATABASE_URL -e PW -e EMAIL="${{ inputs.email }}" \
            -v /tmp/fix_user.sql:/fix_user.sql:ro postgres:17 \
            sh -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v email="$EMAIL" -v pw="$PW" -f /fix_user.sql' \
            || { echo "✗ 失敗"; exit 1; }
          echo "✓ 診斷與修復完成"
