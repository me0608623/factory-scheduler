name: 套用資料庫 migration
on:
  workflow_dispatch:
    inputs:
      migration:
        description: '僅允許已審核0037'
        required: true
        type: choice
        options: [0037_permission_whitelist_complete.sql]
      backup_artifact_id:
        description: '24小時內完整加密備份artifact ID'
        required: true
        type: string
      restore_run_id:
        description: '同一備份的完整還原＋0037副本演練成功run ID'
        required: true
        type: string
      apply:
        description: '真的套用正式0037；未勾選只核對關卡，不連正式DB'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: production-schema-migration
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 新鮮密文、完整還原證據、0037副本演練與本SHA全套CI關卡
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKUP_ARTIFACT_ID: ${{ inputs.backup_artifact_id }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
        run: |
          node tools/release-backup-gate.mjs
      - name: 核對演練版本不是不相干的程式分支
        run: git merge-base --is-ancestor "$VERIFIED_RESTORE_SHA" HEAD
      - name: 編譯唯一授權migration與資料不变guard
        env:
          MIGRATION: ${{ inputs.migration }}
          GUARDED_MIGRATION_FILE: ${{ runner.temp }}/migration/guarded-0037.sql
        run: |
          mkdir "$RUNNER_TEMP/migration"
          node tools/migration-guard.mjs
      - name: 正式套用（同一交易；任何資料／角色變動則整筆回滾）
        if: inputs.apply
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import {productionConnectionAllowed} from "./tools/migration-guard.mjs"; if(!productionConnectionAllowed(process.env.DATABASE_URL)) {console.error("Production connection mismatch");process.exit(1)}'
          docker run --rm -e DATABASE_URL -v "$RUNNER_TEMP/migration:/migration:ro" postgres:17 sh -ec 'psql "$DATABASE_URL" -X --single-transaction -v ON_ERROR_STOP=1 -q -f /migration/guarded-0037.sql' > "$RUNNER_TEMP/migration-private.log" 2>&1 || { echo '0037 transaction rejected; no partial migration committed'; exit 1; }
          echo 'Reviewed 0037 committed; transaction guards confirmed existing rows/roles/RLS/sequences unchanged'
      - name: 未套用說明
        if: ${{ !inputs.apply }}
        run: echo 'Release evidence checked only; production database NOT connected or modified'
      - name: 清除暫存（不公開SQL診斷或資料指紋）
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/migration"
          rm -f -- "$RUNNER_TEMP/migration-private.log" release-proof.zip release-backup.zip
