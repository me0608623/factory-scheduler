name: Tests

on:
  push:
    paths:
      - "db/**"
      - "web/**"
      - "solver/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/acceptance-sim.yml"
      - ".github/workflows/nightly-backup.yml"
      - ".github/workflows/apply-migration.yml"
      - ".github/workflows/backup-drill.yml"
      - ".github/workflows/catalog-inventory.yml"
      - ".github/workflows/permissions-drill.yml"
      - "tools/**"
  pull_request:
    paths:
      - "db/**"
      - "web/**"
      - "solver/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/acceptance-sim.yml"
      - ".github/workflows/nightly-backup.yml"
      - ".github/workflows/apply-migration.yml"
      - ".github/workflows/backup-drill.yml"
      - ".github/workflows/catalog-inventory.yml"
      - ".github/workflows/permissions-drill.yml"
      - "tools/**"

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db/tests/package-lock.json
      # 跨層整合測試會 spawn `uv run python -m scripts.plan_stdio`，需要 Python＋uv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: npm ci
        working-directory: db/tests
      - run: npm test
        working-directory: db/tests
      - run: npm run test:integration:all
        working-directory: db/tests
        env:
          UV_FROZEN: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: sudo apt-get update -qq && sudo apt-get install -y age
      - run: node --test tools/*.test.mjs
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv run --frozen pytest -q -rP
        working-directory: solver
      # Synthetic-only artifact for the isolated cloud test environment. No database credentials.
      - name: Prepare and validate isolated cloud test schedule
        run: uv run --frozen node ../tools/cloud-test-seed.mjs --url https://fkefarcwadvyqqjcjxvp.supabase.co --today $(date -u +%F) --out ../outputs/cloud-test-seed-ci
        working-directory: solver
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-cloud-test-seed
          path: outputs/cloud-test-seed-ci/
          retention-days: 7
