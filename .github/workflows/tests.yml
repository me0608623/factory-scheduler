name: Tests

on:
  push:
    paths:
      - "db/**"
      - "web/**"
      - "solver/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "db/**"
      - "web/**"
      - "solver/**"
      - ".github/workflows/tests.yml"

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db/tests/package-lock.json
      # 跨層整合測試會 spawn `uv run python -m scripts.plan_stdio`，需要 Python＋uv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: npm ci
        working-directory: db/tests
      - run: npm test
        working-directory: db/tests
      - run: npm run test:integration:all
        working-directory: db/tests
        env:
          UV_FROZEN: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv run --frozen pytest -q -rP
        working-directory: solver
