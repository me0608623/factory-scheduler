# 建立 Blueprint 前請先閱讀 README 的付費、資料庫與帳號檢查項目。
# 這個檔案本身不會建立服務；同步 Blueprint 才會建立一個付費的 2 GB 排程服務。
services:
  - type: web
    name: factory-scheduler-solver
    runtime: docker
    plan: 1c-2g
    region: singapore
    rootDir: solver
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://kjnnguekhshkhgycmryl.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOLVER_DISABLE_SNAPSHOT_API
        value: "1"
      # 這兩個 AI 旗標由 Render dashboard 管理（sync:false）：Blueprint 同步不得用檔案值蓋掉
      # 既有設定（2026-10-15 曾把正式 true 蓋成 false）。程式碼為嚴格 'true' 判斷——
      # 服務重建時缺失＝停用（fail-closed），不暗含資料外傳同意。
      - key: AI_SCHEDULE_DATA_APPROVED
        sync: false
      - key: SCHEDULE_CHAT_AI_ENABLED
        sync: false
      - key: SCHEDULE_CHAT_PROVIDER
        value: zai_coding
      - key: SCHEDULE_CHAT_MODEL
        value: glm-5.3-flash
      - key: ZAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        fromService:
          name: factory-scheduler-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: factory-scheduler-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://kjnnguekhshkhgycmryl.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SOLVER_URL
        fromService:
          name: factory-scheduler-solver
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # 測試模式（?mode=test）：連獨立 staging 環境，見 docs/TEST_MODE.md。
      # 三個必要值都設好後正式站才會出現「進入測試模式」入口；缺任一則 fail-closed 停用。
      - key: VITE_TEST_SUPABASE_URL
        sync: false
      - key: VITE_TEST_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TEST_SOLVER_URL
        sync: false
      - key: VITE_TEST_SOLVER_API_KEY
        sync: false
