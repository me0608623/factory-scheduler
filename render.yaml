# 建立 Blueprint 前請先閱讀 README 的付費、資料庫與帳號檢查項目。
# 這個檔案本身不會建立服務；同步 Blueprint 才會建立一個付費的 2 GB 排程服務。
services:
  - type: web
    name: factory-scheduler-solver
    runtime: docker
    plan: 1c-2g
    region: singapore
    rootDir: solver
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://kjnnguekhshkhgycmryl.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SOLVER_DISABLE_SNAPSHOT_API
        value: "1"
      - key: ALLOWED_ORIGINS
        fromService:
          name: factory-scheduler-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: factory-scheduler-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://kjnnguekhshkhgycmryl.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SOLVER_URL
        fromService:
          name: factory-scheduler-solver
          type: web
          envVarKey: RENDER_EXTERNAL_URL
